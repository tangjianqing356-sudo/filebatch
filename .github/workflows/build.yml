name: 构建与验证

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- Windows：必须在真 Windows 上构建，不能在 Mac 上硬做 ----------
  windows:
    name: Windows x64 构建与验证
    runs-on: windows-latest
    env:
      # 双保险：程序里已经自己把 stdout 切成 UTF-8 了，这里再兜一层。
      # Windows 控制台默认 GBK/cp1252，打印中文会抛 UnicodeEncodeError。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5

      - name: 准备 Python 3.12 环境
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt --python .venv/Scripts/python.exe

      - name: 跑全部测试（含 Windows 专属的路径 / 编码 / 权限用例）
        env:
          QT_QPA_PLATFORM: offscreen
        # -rs 会打印每个跳过用例的原因，方便确认是合理的平台条件跳过而不是漏测
        run: .venv/Scripts/python.exe -m pytest -v -rs

      - name: 检查不同 DPI 缩放下的布局（100% / 125% / 150% / 200%）
        run: .venv/Scripts/python.exe scripts/check_dpi.py

      - name: 生成应用图标
        run: |
          $env:PYTHONPATH="src"
          .venv/Scripts/python.exe scripts/make_icon.py

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m PyInstaller packaging/app.spec --distpath dist_app --workpath build --noconfirm --clean 2>&1 | Tee-Object -FilePath pyinstaller.log
          Write-Host "`n──── 打包日志里的 WARNING / ERROR ────"
          $problems = Select-String -Path pyinstaller.log -Pattern 'WARNING|ERROR' -CaseSensitive
          if ($problems) { $problems | ForEach-Object { Write-Host $_.Line } }
          else { Write-Host "无（0 条）" }

      - uses: actions/upload-artifact@v4
        with:
          name: PyInstaller打包日志
          path: pyinstaller.log
          retention-days: 30

      - name: 运行环境与长路径探测
        run: dist_app/FileBatchTool/FileBatchTool.exe --env-report

      - name: 验证 exe 的版本信息与图标真的写进去了
        shell: pwsh
        run: |
          $exe = "dist_app/FileBatchTool/FileBatchTool.exe"
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "──── exe 版本信息 ────"
          Write-Host "ProductName     $($vi.ProductName)"
          Write-Host "FileDescription $($vi.FileDescription)"
          Write-Host "FileVersion     $($vi.FileVersion)"
          Write-Host "ProductVersion  $($vi.ProductVersion)"
          Write-Host "CompanyName     '$($vi.CompanyName)'  (应为空，我们不编造公司信息)"
          if ($vi.ProductName -ne "文件批量处理工具") { throw "ProductName 没写进 exe" }
          if ($vi.FileVersion -notlike "1.0.0*")      { throw "版本号没写进 exe" }

          Write-Host "`n──── exe 图标 ────"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $icon) { throw "exe 里没有图标" }
          Write-Host "图标尺寸 $($icon.Width)x$($icon.Height)  ✓ 已嵌入"

      - name: 看看 Defender 有没有报警
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "──── Defender 威胁记录 ────"
          $t = Get-MpThreatDetection -ErrorAction SilentlyContinue
          if ($t) { $t | Format-List } else { Write-Host "无威胁记录" }
          Write-Host "`n──── exe 是否还在（没被隔离）────"
          Test-Path dist_app/FileBatchTool/FileBatchTool.exe

      # 下面三步都要核对输出里的结论行。
      # 只看退出码是不够的：第一次跑 CI 时 --acceptance 一个字都没打印、
      # 退出码却是 0，那一步"通过"了却什么都没验证。
      - name: 打包产物自检（验证冻结后依赖是否完整）
        shell: pwsh
        run: |
          $out = dist_app/FileBatchTool/FileBatchTool.exe --selftest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "自检退出码 $LASTEXITCODE" }
          if ($out -notmatch '失败 0 项') { throw "自检没有打印预期的结论行（可能根本没输出）" }

      - name: 打包产物完整验收（11 个功能各跑一遍真实流程）
        shell: pwsh
        run: |
          $out = dist_app/FileBatchTool/FileBatchTool.exe --acceptance 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "验收退出码 $LASTEXITCODE" }
          if ($out -notmatch '共 11 个功能，失败 0 个') { throw "验收没有打印预期的结论行（可能根本没输出）" }

      - name: 平台边界验收（中文/空格/长路径、文件占用、权限、盘符、.xlsm）
        # 这一项在 Windows 上才有真正的结论：文件锁、路径上限、权限模型
        # 和 macOS 完全不是一回事
        shell: pwsh
        run: |
          $out = dist_app/FileBatchTool/FileBatchTool.exe --platform-check 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "平台边界验收退出码 $LASTEXITCODE" }
          if ($out -notmatch '共 \d+ 项，失败 0 项') { throw "平台边界验收没有打印预期的结论行（可能根本没输出）" }

      - name: 记录冷启动与内存
        run: dist_app/FileBatchTool/FileBatchTool.exe --measure-startup

      - name: 各 DPI 缩放下截图（用打包后的 exe，拿真实 Windows 渲染）
        run: .venv/Scripts/python.exe scripts/check_dpi.py --exe dist_app/FileBatchTool/FileBatchTool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-DPI截图
          path: docs/screenshots/dpi/
          retention-days: 30

      - name: 记录体积
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist_app/FileBatchTool -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("onedir 原始大小 {0:N1} MB" -f $size)

      - name: 打成压缩包
        shell: pwsh
        run: |
          # 说明文件放在 zip 里、exe 旁边即可；Windows 的 exe 没有 macOS 那种签名封印问题
          Copy-Item README.md dist_app/FileBatchTool/使用说明.txt
          Compress-Archive -Path dist_app/FileBatchTool/* -DestinationPath 文件批量处理工具_Windows_x64.zip
          $zip = (Get-Item 文件批量处理工具_Windows_x64.zip).Length / 1MB
          Write-Host ("zip 后大小 {0:N1} MB" -f $zip)

      - uses: actions/upload-artifact@v4
        with:
          name: 文件批量处理工具-Windows-x64
          path: 文件批量处理工具_Windows_x64.zip
          retention-days: 30

  # ---------- macOS：这里只做回归，正式 .app 在本机产出 ----------
  macos:
    name: macOS 测试
    # 原来写的 macos-13（Intel，和开发机一致），但 GitHub 已经把 Intel 版
    # 托管 runner 下线了：实测同一个 run 里 Windows 几秒就被调度，
    # macOS job 排了近 4 小时一次都没启动过。
    #
    # 这个 job 只跑回归（pytest / DPI / 平台边界），不产出发布包——
    # 正式 .app 仍然在本机 Intel 上打，所以架构不一致不影响交付物，
    # 反而多了一层 arm64 的覆盖。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 准备环境
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt --python .venv/bin/python
      - name: 跑全部测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest -v -rs
      - name: DPI 布局检查
        run: .venv/bin/python scripts/check_dpi.py
      - name: 平台边界验收（macOS 侧，作为对照）
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          out=$(.venv/bin/python -m filebatch --platform-check 2>&1)
          echo "$out"
          echo "$out" | grep -q "失败 0 项" || { echo "没有打印预期的结论行"; exit 1; }
